<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Raccoon Heist Tycoon</title>
  <link rel="stylesheet" href="css/style.css?v=20261127000152" />
  <script>window.RH_RELEASE = true; window.RH_PREVIEW = true;</script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="hud-left">
      <div id="money"><span class="coin">🪙</span><span id="coins">0</span><span id="income"></span></div>
      <div id="heat"><span id="heat-label">🚨</span><div class="bar"><div id="heat-fill"></div></div><span id="heat-pct">0%</span><span class="help">?</span></div>
    </div>
    <canvas id="minimap" width="260" height="76"></canvas>
    <div id="hud-buttons">
      <button class="hbtn" id="btn-album">📖<span class="hlabel"></span></button>
      <button class="hbtn" id="btn-wardrobe">👒<span class="hlabel"></span></button>
      <button class="hbtn" id="btn-chest">🎁<span class="sub"></span><span class="hlabel"></span></button>
      <button class="hbtn" id="btn-boost">⚡<span class="sub"></span><span class="hlabel"></span></button>
      <button class="hbtn small" id="btn-sound">🔊</button>
      <button class="hbtn small" id="btn-lang">EN</button>
    </div>
    <div id="tut-hint"></div>
  </div>

  <div id="panel">
    <div id="panel-head"><span id="panel-title"></span><button id="panel-close">✕</button></div>
    <div id="panel-body"></div>
  </div>

  <div id="toasts"></div>
  <div id="modal"></div>
  <div id="loading">🦝</div>

  <script src="js/config.js?v=20261127000152"></script>
  <script src="js/strings.js?v=20261127000152"></script>
  <script src="js/audio.js?v=20261127000152"></script>
  <script src="js/poki.js?v=20261127000152"></script>
  <script src="js/save.js?v=20261127000152"></script>
  <script src="js/input.js?v=20261127000152"></script>
  <script src="js/sprites.js?v=20261127000152"></script>
  <script src="js/game.js?v=20261127000152"></script>
  <script src="js/chase.js?v=20261127000152"></script>
  <script src="js/ui.js?v=20261127000152"></script>
  <script src="js/main.js?v=20261127000152"></script>
</body>
</html>
